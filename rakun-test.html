<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barida • 3D Rakun Testi</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,sans-serif}header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22}a{color:#a5e5ff}main{max-width:1100px;margin:24px auto;padding:0 16px}h1{font-size:24px}p{color:#b9c6db;line-height:1.6}.viewer{height:min(68vh,650px);min-height:360px;border:1px solid #ffffff22;border-radius:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#384568,#12192d 65%)}canvas{display:block;width:100%;height:100%}.upload{display:inline-block;background:#e6328d;border-radius:12px;padding:13px 18px;cursor:pointer;font-weight:700}.upload input{display:none}#status{margin-left:12px;font-size:14px}.hint{font-size:13px}button{border:1px solid #ffffff44;background:#1c2b45;color:white;border-radius:10px;padding:9px 14px;cursor:pointer}</style></head>
<body><header><strong>♟ BARIDA CHESS ACADEMY</strong><a href="academy.html">Akademiye dön</a></header><main><h1>🦝 Rakun 3D Model Testi</h1><p>Rakun GLB dosyasını seç. Model doğrudan bu sayfada açılır; dosyan sunucuya yüklenmez. Fareyle döndür, tekerlekle yakınlaştır.</p><label class="upload">GLB dosyasını seç<input id="file" type="file" accept=".glb,.gltf,model/gltf-binary"></label><span id="status">Model bekleniyor</span><p class="hint">Dosya adı: pixellabs-cute-raccoon-illustration-2735.glb</p><div class="viewer" id="viewer"></div><p><button id="reset">Görünümü sıfırla</button> <button id="spin">Otomatik dönüş: Açık</button></p></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const el=document.getElementById('viewer'),status=document.getElementById('status'),scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,.01,1000);camera.position.set(0,1.3,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;el.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53637e,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,6,5);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.2;let model=null;
function resize(){const w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(el);resize();
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;status.textContent='Model yükleniyor…';const url=URL.createObjectURL(f);try{const gltf=await new GLTFLoader().loadAsync(url);if(model)scene.remove(model);model=gltf.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model);if(box.isEmpty())throw Error('Model geometrisi boş');const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),radius=Math.max(size.length()*.7,.1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(radius*.8,radius*.4,radius*2));camera.near=Math.max(.001,radius/1000);camera.far=radius*100;camera.updateProjectionMatrix();controls.update();status.textContent='✓ '+f.name+' açıldı';}catch(err){status.textContent='Açılamadı: '+err.message;console.error(err)}finally{URL.revokeObjectURL(url)}});
document.getElementById('reset').onclick=()=>{if(!model)return;const box=new THREE.Box3().setFromObject(model),c=box.getCenter(new THREE.Vector3()),r=Math.max(box.getSize(new THREE.Vector3()).length()*.7,.1);controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(r*.8,r*.4,r*2));controls.update()};
document.getElementById('spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.textContent='Otomatik dönüş: '+(controls.autoRotate?'Açık':'Kapalı')};function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
