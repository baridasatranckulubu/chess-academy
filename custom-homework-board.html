<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BARIDA | Serbest Tahta Ödev Tasarımcısı</title><link rel="stylesheet" href="premium-board.css?v=20261019-solid5"><style>body{background:#101b2d;color:#f4efe6;font:16px system-ui;margin:0;padding:18px}.layout{display:grid;grid-template-columns:minmax(300px,580px) minmax(230px,1fr);gap:22px;max-width:1150px;margin:auto}.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border:8px solid #9a744b;border-radius:12px;overflow:hidden}.sq{border:0;position:relative;display:grid;place-items:center;font-size:clamp(24px,4.8vw,55px);cursor:pointer;padding:0}.sq.light{background:#eedec2}.sq.dark{background:#9d795b}.sq.selected{outline:4px solid #edbd57;outline-offset:-4px}.sq img{width:85%;height:85%;object-fit:contain}.panel{display:grid;align-content:start;gap:12px}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.palette button{font-size:32px;min-height:50px}.panel button,.panel select,.panel input{padding:11px;border-radius:9px;border:1px solid #aa926b}.panel button{cursor:pointer}.active{outline:3px solid #f5c66b}p{line-height:1.5;color:#d2d8e0}.status{color:#f3cb73}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style><style id="barida-homework-analysis-unified">
/* Same shared SVG pieces and visual language as BARIDA analysis board. */
*{box-sizing:border-box}
body{background:#07111b;color:#edf7ff}
.layout{max-width:1240px;grid-template-columns:minmax(300px,640px) minmax(290px,1fr);gap:20px}
.board{background:#513b29;border:7px solid #8b613a;outline:2px solid #d6b178;outline-offset:-3px;border-radius:13px;box-shadow:0 12px 35px #0007}
.board .sq{display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-width:0;min-height:0;overflow:hidden;line-height:1}
.board .sq.light{background:#ead8b7}.board .sq.dark{background:#977454}
.board .sq .piece{display:flex;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none}
.board .sq .piece-3d{width:90%;height:90%;display:block;overflow:visible;filter:drop-shadow(0 2px 2px #0007)}
.board .sq .piece-3d text{paint-order:stroke fill;dominant-baseline:central;text-anchor:middle;font-weight:700}
.palette{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.palette button{display:flex;align-items:center;justify-content:center;min-width:0;height:58px;padding:5px;background:#203442;border:1px solid #587080;color:#f1f7fa;border-radius:10px}
.palette button .piece-3d{width:44px;height:44px;filter:drop-shadow(0 2px 2px #0007)}
.palette button.active{background:#19513e;border-color:#e5b76c;outline:2px solid #e5b76c;outline-offset:0}
.panel{background:#102232;border:1px solid #3d5868;border-radius:14px;padding:16px;align-self:start}
.panel button:not(.palette button){background:#203c4b;color:#f1f7fa;border-color:#567482}
.panel button:hover{background:#2c5862}
.panel select{background:#172e3b;color:#f3f8fa;border-color:#57717c}
@media(max-width:750px){.layout{grid-template-columns:1fr}.palette button{height:52px}}
