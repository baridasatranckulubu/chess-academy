<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Yeni Şifre | Barida Satranç</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08151b;color:#fff;font:16px system-ui}
main{box-sizing:border-box;width:min(92%,420px);padding:32px;background:#10232a;border:1px solid #39876a;border-radius:20px}
label,input,button{display:block;box-sizing:border-box;width:100%;margin:12px 0}
input,button{padding:13px;border-radius:8px;font:inherit}
input{background:#09151b;color:white;border:1px solid #71818a}
button{background:#d52d85;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
a{color:#8bddac}
</style>
</head>
<body>
<main>
<h1>Yeni şifre belirle</h1>
<p id="status" role="status">Kurtarma bağlantısı doğrulanıyor…</p>
<form id="reset" hidden>
<label>Yeni şifre<input id="pw" type="password" autocomplete="new-password" required></label>
<label>Yeni şifre tekrar<input id="confirm" type="password" autocomplete="new-password" required></label>
<button type="submit">Şifreyi kaydet</button>
</form>
<a href="academy.html?giris=antrenor">Yönetim ve antrenör girişine dön</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(async()=>{
 const status=document.getElementById('status');
 const form=document.getElementById('reset');
 const hash=new URLSearchParams(location.hash.slice(1));
 const accessToken=hash.get('access_token'),refreshToken=hash.get('refresh_token');
 const invalidLink='Kurtarma bağlantısı geçersiz veya süresi dolmuş. Giriş ekranından yeni bağlantı isteyin.';
 if(location.hash)history.replaceState(null,'',location.pathname);
 if(hash.get('type')!=='recovery'||!accessToken||!refreshToken){
  status.textContent=invalidLink;
  return;
 }
 if(!window.supabase){
  status.textContent='Giriş servisi yüklenemedi. Bağlantıyı yeniden açıp tekrar deneyin.';
  return;
 }

 const url='https://kbqupsfylankcjgtjzld.supabase.co';
 const key='sb_publishable_BCw6h-WGENfTHeyMa2qqYw_E-f-1QdG';
 const client=window.supabase.createClient(url,key,{auth:{
  storageKey:'barida-password-recovery',persistSession:false,autoRefreshToken:false,detectSessionInUrl:false
 }});
 let session;
 try{
  const {data,error}=await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
  if(error||!data.session)throw Error(invalidLink);
  session=data.session;
  const verified=await client.auth.getUser(session.access_token);
  if(verified.error||!verified.data.user)throw Error(invalidLink);
 }catch{
  status.textContent=invalidLink;
  return;
 }

 form.hidden=false;
 status.textContent='Bağlantı doğrulandı. Yeni şifrenizi belirleyin.';
 const button=form.querySelector('button');
 form.onsubmit=async event=>{
  event.preventDefault();
  if(button.disabled)return;
  const password=document.getElementById('pw').value;
  if(password!==document.getElementById('confirm').value){
   status.textContent='Şifreler eşleşmiyor.';
   return;
  }
  button.disabled=true;
  status.textContent='Şifre kaydediliyor…';
  try{
   const response=await fetch(url+'/functions/v1/academy-account-password',{
    method:'POST',
    headers:{'content-type':'application/json',apikey:key,authorization:'Bearer '+session.access_token},
    body:JSON.stringify({password})
   });
   const result=await response.json();
   if(!response.ok||result.ok!==true)throw Error(result.error||'Şifre güncellenemedi. Tekrar deneyin.');
  }catch(error){
   status.textContent=error.message||'Şifre güncellenemedi. Tekrar deneyin.';
   button.disabled=false;
   return;
  }
  form.reset();
  form.hidden=true;
  status.textContent='Şifreniz güncellendi. Yeni şifrenizle giriş yapabilirsiniz.';
  await client.auth.signOut({scope:'local'}).catch(()=>{});
 };
})();
</script>
</body>
</html>
