<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Yeni Şifre | Barida Satranç</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08151b;color:#fff;font:16px system-ui}main{box-sizing:border-box;width:min(92%,420px);padding:32px;background:#10232a;border:1px solid #39876a;border-radius:20px}label,input,button{display:block;box-sizing:border-box;width:100%;margin:12px 0}input,button{padding:13px;border-radius:8px;font:inherit}input{background:#09151b;color:white;border:1px solid #71818a}button{background:#d52d85;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}a{color:#8bddac}</style></head><body><main><h1>Yeni şifre belirle</h1><p id="status" role="status">Kurtarma bağlantısı doğrulanıyor…</p><form id="reset" hidden><label>Yeni şifre<input id="pw" type="password" autocomplete="new-password" minlength="8" required></label><label>Yeni şifre tekrar<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button>Şifreyi kaydet</button></form><a href="academy.html">Giriş ekranına dön</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
(async()=>{const status=document.getElementById('status'),form=document.getElementById('reset');const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);const fail=()=>{status.textContent='Kurtarma bağlantısı geçersiz veya süresi dolmuş. Yeni bir bağlantı isteyin.'};if(hash.get('type')!=='recovery'||!hash.get('access_token')||!hash.get('refresh_token')){fail();return}if(!window.supabase){status.textContent='Giriş servisi yüklenemedi.';return}const client=window.supabase.createClient('https://kbqupsfylankcjgtjzld.supabase.co','sb_publishable_BCw6h-WGENfTHeyMa2qqYw_E-f-1QdG',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});try{const {data,error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});history.replaceState(null,'',location.pathname);if(error||!data.session){fail();return}const verified=await client.auth.getUser();if(verified.error||!verified.data.user){fail();return}form.hidden=false;status.textContent='En az 8 karakterli yeni şifrenizi belirleyin.';form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('pw').value,b=document.getElementById('confirm').value,button=form.querySelector('button');if(a!==b){status.textContent='Şifreler eşleşmiyor.';return}button.disabled=true;try{const {error}=await client.auth.updateUser({password:a});if(error)throw error;form.reset();form.hidden=true;status.textContent='Şifreniz güncellendi. Yeni şifrenizle giriş yapabilirsiniz.';await client.auth.signOut({scope:'local'});}catch(e){status.textContent='Şifre kaydedilemedi. '+(e.message||'Tekrar deneyin.');button.disabled=false}}}catch(e){fail()}})();
</script></body></html>
