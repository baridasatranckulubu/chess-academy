name: Chess Academy | Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Satranç motoru, dersler ve tarayıcı
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: İlk adım XP ve seviye kontrolleri
        run: node tests/beginner_release.test.js
      - name: Eksiksiz Lichess tema ve açılış kapsamı
        run: node tests/puzzle_topics.test.js
      - name: Lichess tematik ödev regresyonu
        run: node tests/assignments_themes.test.js
      - name: Tam arşiv sayısı, sıkıştırma ve seçmeli yükleme
        run: node tests/full_catalog.test.js
      - name: Tam havuz zorunluluğu ve rastgele yeni soru seçimi
        run: node tests/puzzle_history_selection.test.js
      - name: Konuya özel hızlı soru yükleme
        run: node tests/puzzle_loading.test.js
      - name: Satranç motoru
        run: node tests/engine.test.js
      - name: Tahta SVG ve 360 derece dönüş doğrulaması
        run: node tests/board_visual_consistency.test.js
      - name: Tüm bölümlerde premium tahta kontrolleri
        run: node tests/board_shared.test.js
      - name: Öğrenci yönetimi ve ortak ödev tahtası
        run: node tests/admin_student_management.test.js
      - name: Alınan taşlar ve Koordinat Avı testi
        run: node tests/captured_and_timer.test.js
      - name: Öğrenci bilgileri ve kayıt görünümü
        run: node tests/student_detail_layout.test.js
      - name: Şifre penceresi ve kayıt çerçevesi
        run: node tests/student_password_modal.test.js
      - name: Ön planda geçen süre ve kapalı sayfa kontrolü
        run: node tests/site_presence.test.js
      - name: Premium tahta ve ses kontrolleri
        run: node tests/board_premium.test.js
      - name: Mat pozisyonları
        run: node tests/puzzles.test.js
      - name: Ders çevirileri
        run: node tools/check-i18n.js --strict
      - name: Müfredat doğrulaması (v0.22+)
        run: |
          if [ -f tests/curriculum_v22.test.js ]; then
            node tests/curriculum_v22.test.js
          else
            echo "v0.22 müfredat testi henüz depoda yok; atlanıyor."
          fi
      - name: Chromium ve Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright beautifulsoup4
          timeout 180s python -m playwright install chromium
      - name: Herkese açık ana sayfa, iletişim ve giriş bağlantısı
        run: python tests/browser_public_home_qa.py
      - name: Ödev hızı ve yavaş istatistik servisi regresyonu
        run: python tests/browser_assignment_speed_qa.py
      - name: Ortak ana sayfa, roller, bildirimler ve mobil görünüm
        run: python tests/browser_club_qa.py
      - name: Kaldırılan Hamle Atölyesi rotaları
        run: python tests/browser_workshop_qa.py
      - name: Merkezi istatistik, puan ve sınıf entegrasyonu
        run: python tests/browser_integration_oct25_qa.py
      - name: Kayıt servisi, doğrulama ve hesap temizliği
        run: node tests/registration.test.js
      - name: Hesaba bağlı bulmaca geçmişi ve tekrarsız soru seçimi
        run: python tests/browser_puzzle_history_qa.py
      - name: Tek Rating, soru başına bir sonuç ve puana göre zorluk
        run: python tests/browser_unified_rating_qa.py
      - name: Buton seçimleri, geçersiz oturum, sınıf mesajları ve 9 kademe
        run: python tests/browser_admin_controls_qa.py
      - name: Sporcu ve antrenör kayıt mesajları
        run: python tests/browser_registration_qa.py
      - name: Serbest tahta soruları, kayıt ve sporcuya atama
        run: python tests/browser_custom_questions_qa.py
      - name: Tüm konu grupları, arama ve açılış ödevi
        run: python tests/browser_puzzle_topics_qa.py
      - name: Tek sporcu, sınıf ve tüm sporculara toplu ödev
        run: python tests/browser_bulk_assignments_qa.py
      - name: İki hesapta tek tuşla Lichess ödevi
        run: python tests/browser_live_assignments_qa.py
      - name: İlk giriş bildirimi, sakin tahta ve kaldırılan arena
        run: python tests/browser_club_updates_qa.py
      - name: Lichess ses dosyaları, başlangıç ve son 10 saniye tik tak
        run: python tests/browser_sound_qa.py
      - name: Mobil giriş, güvenli saklama ve gezinme
        run: python tests/browser_mobile_qa.py
      - name: Test ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barida-interface-checks
          path: qa-artifacts/
          retention-days: 7
      - name: Taş boyutları ve yüzde 7 küçük piyonlar
        run: python tests/browser_piece_sizes.py
      - name: Tarayıcı regresyon testi (v0.22+)
        run: |
          if [ -f tests/browser_v22_qa.py ]; then
            sed -i "s@executable_path='/usr/bin/chromium'@executable_path=None@g" tests/browser_v22_qa.py
            python tests/browser_v22_qa.py
          else
            echo "v0.22 tarayıcı testi henüz depoda yok; atlanıyor."
          fi
      - name: Statik site kaynak kontrolü
        run: python tools/check_site_assets.py
