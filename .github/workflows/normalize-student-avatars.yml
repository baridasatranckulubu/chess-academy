name: Repair 300 student avatar crops
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_student_avatars.py'
      - '.github/workflows/normalize-student-avatars.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install 'Pillow>=10,<13'
      - name: Normalize all 300 images
        run: python scripts/normalize_student_avatars.py
      - name: Commit repaired WebP avatars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatars/
          if ! git diff --cached --quiet; then
            git commit -m "Recenter and crop 300 pawn avatar image files"
            git push
          fi
