name: Install approved BARIDA chess pieces
on:
  push:
    paths:
      - '.github/workflows/install-barida-pieces.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate twelve approved PNG pieces
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          z=zipfile.ZipFile('barida-approved-pieces.zip')
          dst=pathlib.Path('assets/barida-pieces')
          dst.mkdir(parents=True,exist_ok=True)
          expected={f'{c}-{p}.png' for c in ('white','black') for p in ('king','queen','rook','bishop','knight','pawn')}
          found={}
          for entry in z.infolist():
              name=pathlib.PurePosixPath(entry.filename).name
              if name in expected:
                  found[name]=entry
          missing=expected-set(found)
          if missing:
              raise SystemExit('Missing chess pieces: '+str(sorted(missing)))
          for name,entry in found.items():
              data=z.read(entry)
              if not data.startswith(b'\\x89PNG\\r\\n\\x1a\\n'):
                  raise SystemExit('Invalid PNG: '+name)
              (dst/name).write_bytes(data)
          print('Installed',len(found),'approved pieces')
          PY
      - name: Commit installed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/barida-pieces
          if ! git diff --cached --quiet; then
            git commit -m "Install approved 12 transparent chess piece images"
            git push
          fi
