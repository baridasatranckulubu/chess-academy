name: Install Stockfish 19 WASM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-stockfish-wasm.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify Stockfish 19 Lite Single WASM
        run: |
          set -euo pipefail
          mkdir -p engines/stockfish19
          # jsDelivr returns HTTP 403 for the oversized stockfish npm package.
          # Fetch the official published npm tarball instead of the CDN.
          npm pack stockfish@19.0.1 --pack-destination /tmp --silent
          archive=$(find /tmp -maxdepth 1 -name 'stockfish-19.0.1.tgz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C engines/stockfish19 --strip-components=2 \
            package/bin/stockfish-19-lite-single.js \
            package/bin/stockfish-19-lite-single.wasm
          test "$(wc -c < engines/stockfish19/stockfish-19-lite-single.js)" -gt 10000
          test "$(wc -c < engines/stockfish19/stockfish-19-lite-single.wasm)" -gt 100000
          file engines/stockfish19/stockfish-19-lite-single.wasm
          python3 - <<'PY'
          from pathlib import Path
          assert Path('engines/stockfish19/stockfish-19-lite-single.wasm').read_bytes()[:4] == bytes([0,97,115,109])
          PY
      - name: Commit local engine files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engines/stockfish19/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Stockfish 19 WASM engine binaries"
            git push
          fi
