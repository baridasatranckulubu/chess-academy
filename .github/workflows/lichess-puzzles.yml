name: Refresh Lichess CC0 puzzles
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install zstandard
      - name: Stream and curate official Lichess puzzles
        run: python scripts/sync_lichess_puzzles.py
      - name: Commit updated puzzle data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puzzle-data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh curated Lichess CC0 puzzle database"
            git push
          fi
