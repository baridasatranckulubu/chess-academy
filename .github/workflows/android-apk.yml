name: Android Debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-web/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx cap add android
      - name: Set modern Android target and legacy-compatible minimum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          import re
          s,n=re.subn(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 23', s)
          if n != 1:
              raise SystemExit('Could not configure minSdkVersion')
          p.write_text(s)
          print('Android minimum API 23, universal APK for supported CPU architectures')
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-academy-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
