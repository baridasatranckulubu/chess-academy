name: Barida Android APK
on:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'tools/*android*'
      - 'mobile.*'
      - '.github/workflows/android-apk.yml'
      - 'site-presence.js'
      - 'academy.js'
      - 'academy.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Verify native API origin
        run: |
          python - <<'PYCODE'
          import urllib.request
          for name in ['academy-student-login','academy-teacher-login','academy-student-password','academy-delete-student','academy-teacher-password-request']:
            request=urllib.request.Request('https://kbqupsfylankcjgtjzld.supabase.co/functions/v1/'+name,method='OPTIONS',headers={'Origin':'https://localhost','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'apikey,content-type,authorization'})
            with urllib.request.urlopen(request,timeout=30) as response:
              assert response.status==204 and response.headers.get('Access-Control-Allow-Origin')=='https://localhost',name
              print('Native origin OK:',name)
          PYCODE
      - name: Bundle application and generate Android project
        run: |
          python tools/prepare_android.py
          npx cap add android
          python tools/configure_android.py
          npx cap sync android
      - name: Build installable test APK and instrumentation
        working-directory: android
        run: bash ./gradlew  :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Enable hardware acceleration for this runner
        run: sudo chown "$(id -un)" /dev/kvm
      - name: Verify Android Keystore and bundled login on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash -c 'cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon'
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.baridasatranckulubu.academy/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/barida-login.png
            adb pull /sdcard/barida-login.png "$GITHUB_WORKSPACE/barida-login.png"
      - name: Upload tested installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Barida-Satranc-1.0.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Barida-Android-test-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            barida-login.png
          retention-days: 14
