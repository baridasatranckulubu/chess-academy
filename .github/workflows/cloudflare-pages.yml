name: Deploy Barida to Cloudflare Pages
on:
  workflow_run:
    workflows: ["Chess Academy | Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baridachess-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_ACCOUNT_ID: 93c0e9ef9defdeb95adf4e052639a568
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site before production deployment
        run: |
          for test in tests/*.test.js; do node "$test" || exit 1; done
          node tools/check-i18n.js --strict
          python tools/check_site_assets.py
      - name: Prepare static site
        shell: python
        run: |
          from pathlib import Path
          import shutil,json,os
          root = Path(".")
          out = Path("_pages")
          out.mkdir()
          extensions = {".html", ".css", ".js", ".webp", ".png", ".ico", ".svg"}
          for p in root.iterdir():
              if p.is_file() and (p.suffix in extensions or p.name in {"_headers", "_redirects"}):
                  shutil.copy2(p, out / p.name)
          for name in ["assets", "data", "puzzle-data", "puzzle-full", "engines", "i18n"]:
              if (root / name).is_dir():
                  shutil.copytree(root / name, out / name)
          assert sum(1 for p in out.rglob("*") if p.is_file()) < 20000
          assert (out / "index.html").is_file()
          assert (out / "academy.html").is_file()
          revision = os.environ["GITHUB_SHA"]
          # workflow_run checks out the tested SHA rather than the workflow's default SHA.
          import subprocess
          revision = subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          (out / "site-version.json").write_text(json.dumps({"revision":revision}))
          for page in out.glob("*.html"):
              content=page.read_text()
              page.write_text(content.replace("</head>",'<meta name="barida-revision" content="'+revision+'"></head>',1))
          assert all(p.stat().st_size < 25 * 1024 * 1024 for p in out.rglob("*") if p.is_file())
      - name: Ensure the exact Barida Satranc address exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ensure-pages-project.mjs
      - name: Deploy production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 93c0e9ef9defdeb95adf4e052639a568
          command: pages deploy _pages --project-name=baridasatranc --branch=main
      - name: Keep the previous address available
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 93c0e9ef9defdeb95adf4e052639a568
          command: pages deploy _pages --project-name=baridachess --branch=main
