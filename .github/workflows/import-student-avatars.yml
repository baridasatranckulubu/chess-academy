name: Import 300 student pawn avatars
on:
  push:
    branches: [main]
    paths:
      - 'BARIDA_300_Piyon_Avatari.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-avatars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate all 300 avatars
        shell: bash
        run: |
          set -euo pipefail
          test -f BARIDA_300_Piyon_Avatari.zip
          mkdir -p assets/avatars
          unzip -oq BARIDA_300_Piyon_Avatari.zip -d .
          count=$(find assets/avatars -maxdepth 1 -type f -name 'piyon-*.webp' | wc -l)
          test "$count" -eq 300 || { echo "Expected 300 images; found $count"; exit 1; }
          for i in $(seq -w 1 300); do :; done
          test -f assets/avatars/piyon-001.webp
          test -f assets/avatars/piyon-300.webp
      - name: Commit imported images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatars/
          if ! git diff --cached --quiet; then
            git commit -m "Import 300 illustrated pawn avatar images"
            git push
          fi
