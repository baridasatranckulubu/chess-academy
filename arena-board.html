<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Academy Arena</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142532}body{display:grid;place-items:center}.board{width:min(100vw,100vh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:6px solid #473525;border-radius:8px;overflow:hidden;touch-action:none}.sq{min-width:0;min-height:0;display:grid;place-items:center;border:0;padding:0;cursor:pointer;position:relative;touch-action:none}.light{background:#e7c99e}.dark{background:#8a6245}.sq.selected{box-shadow:inset 0 0 0 4px #e8c567}.sq.target:after{content:"";width:22%;height:22%;border-radius:50%;background:#387b54aa;position:absolute;pointer-events:none}.sq.last-move{background-image:linear-gradient(#f5dc6633,#f5dc6633)}.piece{width:88%;height:88%;display:grid;place-items:center;pointer-events:none}.piece svg{width:100%;height:100%;display:block}.ca-drag-ghost{position:fixed;width:66px;height:66px;transform:translate(-50%,-50%);pointer-events:none;z-index:100}.ca-drag-ghost svg{width:100%;height:100%}.piece svg text{font-family:'DejaVu Sans','Segoe UI Symbol','Noto Sans Symbols 2',serif;font-size:75px;dominant-baseline:alphabetic}.piece svg{overflow:visible}.sq .piece{font-size:clamp(24px,7vw,66px)}</style></head><body><div id="board" class="board" role="group" aria-label="Satranç tahtası"></div><script src="engine.js"></script><script src="shared-chess-board.js"></script><script>(function(){'use strict';const core=window.ChessAcademyEngine,ui=window.ChessAcademySharedBoard,root=document.getElementById('board');if(!core||!ui){root.textContent='Tahta yüklenemedi';return}const game=new core.ChessEngine();let selected=null,lastMove=null;const drag=ui.bindDrag(root,{canDrag:sq=>{const p=game.at(sq);return !!p&&(p===p.toUpperCase()?'w':'b')===game.turn&&!game.isGameOver()},onDrop:(from,to)=>play(from,to)});function render(){ui.renderBoard({root,game,selected,lastMove,onSquare:sq=>{if(drag.consumeClick())return;const p=game.at(sq);if(selected){const from=selected;selected=null;if(from!==sq&&play(from,sq))return}if(p&&(p===p.toUpperCase()?'w':'b')===game.turn)selected=sq;render()}})}function play(from,to){const options=game.moves({square:from}).filter(m=>m.to===to);if(!options.length){render();return false}const capture=!!game.at(to)||options.some(m=>m.enPassant);const move=game.move(from,to,'q');if(!move){render();return false}selected=null;lastMove={from,to};ui.sound(game.isCheckmate()?'mate':game.isCheck()?'check':capture?'capture':'move');render();parent.postMessage({type:'chess-academy-board-move',turn:game.turn},location.origin);return true}render()})();</script></body></html>
