<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yeni Şifre Oluştur | Chess Academy</title><link rel="stylesheet" href="academy.css"><style>main{max-width:520px;margin:9vh auto;padding:24px}.reset-card{background:#122531;color:#f0f5f5;border:1px solid #405360;border-radius:18px;padding:28px;display:grid;gap:14px}.reset-card input{width:100%;padding:14px;background:#091923;color:white;border:1px solid #48616e;border-radius:9px}.reset-card button{padding:14px;border:0;border-radius:9px;background:#d2af72;color:#13232c;font-weight:700;cursor:pointer}.reset-card button:disabled{opacity:.6}.reset-card a{color:#e5c78f}#status{min-height:24px}</style><link rel="stylesheet" href="mobile.css?v=20261026-native-speed1"></head>
<body><main><form id="reset" class="reset-card"><h1>♞ Yeni Şifre Oluştur</h1><p>Chess Academy hesabınız için yeni şifrenizi belirleyin.</p><label>Yeni şifre<input id="password" type="password" autocomplete="new-password" required></label><label>Yeni şifre (tekrar)<input id="confirm" type="password" autocomplete="new-password" required></label><button id="submit" type="submit" disabled>Şifreyi Kaydet</button><p id="status" role="status">Bağlantı doğrulanıyor...</p><a href="academy.html">Giriş sayfasına dön</a></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(async()=>{
const status=document.getElementById('status'),button=document.getElementById('submit');
const client=window.supabase.createClient('https://kbqupsfylankcjgtjzld.supabase.co','sb_publishable_BCw6h-WGENfTHeyMa2qqYw_E-f-1QdG');
const fragment=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
if(fragment.get('error')||query.get('error')){status.textContent='Bağlantı geçersiz veya süresi dolmuş. Giriş sayfasından yeni sıfırlama bağlantısı isteyin.';return}
try{
if(query.has('token_hash')){const result=await client.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});if(result.error)throw result.error}
else if(query.has('code')){const result=await client.auth.exchangeCodeForSession(query.get('code'));if(result.error)throw result.error}
else if(fragment.has('access_token')&&fragment.has('refresh_token')){const result=await client.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});if(result.error)throw result.error}
const {data:{session}}=await client.auth.getSession();
if(!session)throw Error('Geçerli sıfırlama oturumu bulunamadı.');
button.disabled=false;status.textContent='Bağlantı doğrulandı. Yeni şifrenizi belirleyin.';
history.replaceState(null,'',location.pathname);
}catch(error){status.textContent='Bağlantı doğrulanamadı. Yeni sıfırlama e-postası isteyin.'}
document.getElementById('reset').addEventListener('submit',async event=>{
event.preventDefault();const password=document.getElementById('password').value;
if(password!==document.getElementById('confirm').value){status.textContent='Şifreler eşleşmiyor.';return}
button.disabled=true;status.textContent='Şifre kaydediliyor...';
try{
const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Oturumunuz sona erdi.');
const response=await fetch('https://kbqupsfylankcjgtjzld.supabase.co/functions/v1/academy-account-password',{method:'POST',headers:{'content-type':'application/json','apikey':'sb_publishable_BCw6h-WGENfTHeyMa2qqYw_E-f-1QdG','authorization':'Bearer '+session.access_token},body:JSON.stringify({password})});
const result=await response.json();if(!response.ok)throw Error(result.error||'Şifre güncellenemedi');
status.textContent='Şifreniz değiştirildi. Giriş sayfasına yönlendiriliyorsunuz.';
await client.auth.signOut();location.replace('academy.html');
}catch(error){status.textContent=error.message||'Şifre güncellenemedi';button.disabled=false}

});
})();
</script></body></html>
